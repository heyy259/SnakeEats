name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    # Job-level UTF-8 mode: on zh-CN/GBK hosts (Windows) config reads otherwise
    # break on non-ASCII file contents. Linux is unaffected but stays symmetric.
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"

      # Advisory until the baseline is verified clean; do not gate on it yet.
      - name: Ruff (advisory)
        continue-on-error: true
        run: ruff check snakeeats

      # Advisory: type checking is not yet a gate.
      - name: mypy (advisory)
        continue-on-error: true
        run: mypy snakeeats

      - name: pytest (with coverage)
        run: >-
          python -m pytest snakeeats/tests -q
          --cov=snakeeats
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
