name: 功能请求
description: 为 SnakeEats 提议新功能或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先描述场景与期望行为，再谈具体实现。这样更容易判断方案是否贴合真实需求。

  - type: textarea
    id: scenario
    attributes:
      label: 场景
      description: 你遇到的实际问题或使用场景。谁在什么情况下需要它？
      placeholder: "我在 ... 时，希望能 ...，因为 ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望的结果是什么？(期望的 API、输出或交互)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你尝试过或考虑过的其他方案，以及为什么不够好
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、草图或其他上下文（可选）
    validations:
      required: false
