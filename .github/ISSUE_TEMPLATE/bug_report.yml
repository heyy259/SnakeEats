name: Bug 报告
description: 报告 SnakeEats 的可复现缺陷
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的最小信息。安全漏洞请勿在此提交，按 SECURITY.md 的私密渠道上报。

  - type: input
    id: version
    attributes:
      label: 版本
      description: SnakeEats 版本（例如 `0.1.0`，或 `snake version` 输出）
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 操作系统与版本
      placeholder: "Windows 11 23H2 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      description: 运行服务的 Python 版本（要求 >= 3.10）
      placeholder: "3.12.4"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出最小复现步骤
      placeholder: |
        1. 启动服务：`snake serve --port 9876 --token <root-token>`
        2. 客户端调用 ...
        3. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 相关日志、错误码或堆栈（请隐藏真实凭据）
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 你认为有帮助的其他上下文（可选）
    validations:
      required: false
