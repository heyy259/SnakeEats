<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-stream</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="system-status">
                <span id="connection-status">Disconnected</span>
                <span id="system-id">-</span>
                <span id="port">-</span>
            </div>
            <div class="system-controls">
                <button id="btn-connect">Connect</button>
                <button id="btn-disconnect" disabled>Disconnect</button>
            </div>
        </header>

        <!-- Main content area -->
        <main id="main">
            <!-- Left panel -->
            <aside id="sidebar">
                <!-- Stream list -->
                <section id="stream-list-section">
                    <h3>Streams</h3>
                    <input type="text" id="stream-search" placeholder="Search streams...">
                    <div id="stream-list"></div>
                    <button id="btn-create-stream">+ New Stream</button>
                </section>

                <!-- Subscriptions panel -->
                <section id="subscriptions-section">
                    <h3>Active Subscriptions</h3>
                    <div id="subscriptions-list"></div>
                </section>
            </aside>

            <!-- Right main panel -->
            <section id="content-panel">
                <!-- Stream details -->
                <div id="stream-detail" style="display: none;">
                    <div class="stream-header">
                        <h2 id="stream-name">-</h2>
                        <div class="stream-meta">
                            <span id="stream-version">v0</span>
                            <span id="stream-description">-</span>
                            <button id="btn-delete-stream">Delete Stream</button>
                        </div>
                        <div id="stream-tags"></div>
                    </div>

                    <!-- Tabs -->
                    <div class="tabs">
                        <button class="tab active" data-tab="content">Content</button>
                        <button class="tab" data-tab="metadata">Metadata</button>
                        <button class="tab" data-tab="subscribe">Subscribe</button>
                    </div>

                    <!-- Content tab -->
                    <div id="tab-content" class="tab-content active">
                        <div class="editor-toolbar">
                            <button id="btn-read">Read</button>
                            <button id="btn-write">Write</button>
                            <button id="btn-append">Append</button>
                            <button id="btn-undo">Undo</button>
                        </div>
                        <div class="search-bar">
                            <input type="text" id="search-input" placeholder="Search content...">
                            <button id="btn-search">Search</button>
                            <label>
                                <input type="checkbox" id="regex-mode"> Regex
                            </label>
                        </div>
                        <textarea id="editor" placeholder="Stream content will appear here..."></textarea>
                        <div id="search-results"></div>
                    </div>

                    <!-- Metadata tab -->
                    <div id="tab-metadata" class="tab-content">
                        <div class="metadata-form">
                            <label>
                                Description:
                                <input type="text" id="meta-description">
                                <button id="btn-update-desc">Update</button>
                            </label>
                            <div class="tags-section">
                                <h4>Tags</h4>
                                <div id="tags-list"></div>
                                <div class="tag-input">
                                    <input type="text" id="tag-key" placeholder="Key">
                                    <input type="text" id="tag-value" placeholder="Value">
                                    <button id="btn-add-tag">Add</button>
                                </div>
                            </div>
                            <label>
                                Rename:
                                <input type="text" id="new-name">
                                <button id="btn-rename">Rename</button>
                            </label>
                        </div>
                    </div>

                    <!-- Subscribe tab -->
                    <div id="tab-subscribe" class="tab-content">
                        <div class="subscribe-controls">
                            <label>
                                Start position:
                                <input type="number" id="from-position" placeholder="0">
                            </label>
                            <button id="btn-subscribe">Subscribe</button>
                            <button id="btn-unsubscribe" disabled>Unsubscribe</button>
                        </div>
                        <div id="notifications-log">
                            <h4>Change Notifications</h4>
                            <div id="notifications-list"></div>
                        </div>
                    </div>
                </div>

                <!-- Empty state -->
                <div id="empty-state">
                    <p>Select a stream or create a new one to start</p>
                </div>
            </section>
        </main>

        <!-- Footer status bar -->
        <footer id="footer">
            <span id="status-connection">Disconnected</span>
            <span id="status-subscriptions">Subscriptions: 0</span>
            <span id="status-streams">Streams: 0</span>
            <span id="status-last-op">Last operation: -</span>
        </footer>
    </div>

    <!-- Append content modal dialog -->
    <div id="append-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Append Content</h3>
                <button class="modal-close" id="append-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="append-textarea" placeholder="Enter content to append (multiline supported)..." rows="10"></textarea>
            </div>
            <div class="modal-footer">
                <button id="append-modal-cancel" class="btn-secondary">Cancel</button>
                <button id="append-modal-confirm" class="btn-primary">Append</button>
            </div>
        </div>
    </div>

    <script src="js/websocket.js"></script>
    <script src="js/streams.js"></script>
    <script src="js/subscriptions.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
