[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-registry"
version = "0.1.0"
description = "面向 LLM 的工具注册管理与扫描执行系统"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
]
authors = [
    { name = "heyy259", email = "67221771+heyy259@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.hatch.build.targets.wheel]
packages = ["tool_registry", "tool_registry_sdk"]

[project.urls]
Homepage = "https://github.com/heyy259/SnakeEats"
Documentation = "https://github.com/heyy259/SnakeEats#readme"
Repository = "https://github.com/heyy259/SnakeEats"
Issues = "https://github.com/heyy259/SnakeEats/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
    "flake8>=6.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
